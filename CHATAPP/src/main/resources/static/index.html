<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatApp</title>

<!-- SockJS and STOMP loaded via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<!-- Supabase JS client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --bg: #f4f2ec;
    --header-bg: #0e0e17;
    --header-text: #f4f2ec;
    --accent: #6d62e8;
    --bubble-bg: #ffffff;
    --bubble-own: #6d62e8;
    --bubble-own-text: #ffffff;
    --connected: #2e9e4c;
    --disconnected: #d5473b;
    --border: #e2e0d8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  header .app-name {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.3px;
  }

  header .user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }

  #username-display {
    color: var(--accent);
    font-weight: 600;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
  }

  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--disconnected);
    transition: background 0.2s ease;
  }

  .status-dot.connected {
    background: var(--connected);
  }

  #logout-button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: var(--header-text);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
  }

  #logout-button:hover {
    background: rgba(255,255,255,0.08);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message {
    max-width: 70%;
    background: var(--bubble-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 12px;
    align-self: flex-start;
  }

  .message.own {
    align-self: flex-end;
    background: var(--bubble-own);
    color: var(--bubble-own-text);
    border: none;
  }

  .message .meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 3px;
  }

  .message .sender {
    font-weight: 600;
  }

  .message .text {
    font-size: 14.5px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  form#send-form {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    background: var(--bubble-bg);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  #message-input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 14.5px;
    outline: none;
  }

  #message-input:focus {
    border-color: var(--accent);
  }

  #send-button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }

  #send-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #send-button:hover:not(:disabled) {
    opacity: 0.9;
  }
</style>
</head>
<body>

<header>
  <div class="app-name">ChatApp</div>
  <div class="user-info">
    <span>Logged in as <span id="username-display"></span></span>
    <div class="status-indicator">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Disconnected</span>
    </div>
    <button id="logout-button">Log out</button>
  </div>
</header>

<div id="messages"></div>

<form id="send-form">
  <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />
  <button type="submit" id="send-button" disabled>Send</button>
</form>

<script>
  // ---- Configuration ----
  // Change this to point at your deployed Railway backend.
  const SERVER_URL = "https://java-chat-app-production.up.railway.app";

  // ---- Supabase config ----
  // Get these from Supabase dashboard: Settings > API
  const SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_PUBLIC_KEY";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // username is filled in by initAuth() once the Supabase session is confirmed
  let username = null;

  // ---- DOM references ----
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("send-form");
  const input = document.getElementById("message-input");
  const sendButton = document.getElementById("send-button");
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  const logoutButton = document.getElementById("logout-button");

  let stompClient = null;

  // ---- Auth check ----
  // Returns true if a valid Supabase session with a username exists.
  // Redirects to login.html otherwise.
  async function initAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session || !session.user?.user_metadata?.username) {
      window.location.href = "login.html";
      return false;
    }

    username = session.user.user_metadata.username;
    document.getElementById("username-display").textContent = username;
    return true;
  }

  logoutButton.addEventListener("click", async function () {
    if (stompClient && stompClient.connected) {
      stompClient.disconnect();
    }
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  });

  function setConnected(isConnected) {
    if (isConnected) {
      statusDot.classList.add("connected");
      statusText.textContent = "Connected";
      sendButton.disabled = false;
    } else {
      statusDot.classList.remove("connected");
      statusText.textContent = "Disconnected";
      sendButton.disabled = true;
    }
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function formatTime(timestamp) {
    const date = timestamp ? new Date(timestamp) : new Date();
    return date.toLocaleTimeString();
  }

  function renderMessage(msg) {
    const wrapper = document.createElement("div");
    wrapper.className = "message" + (msg.sender === username ? " own" : "");

    const meta = document.createElement("div");
    meta.className = "meta";

    const senderEl = document.createElement("span");
    senderEl.className = "sender";
    senderEl.textContent = msg.sender;

    const timeEl = document.createElement("span");
    timeEl.className = "time";
    timeEl.textContent = formatTime(msg.timestamp);

    meta.appendChild(senderEl);
    meta.appendChild(timeEl);

    const textEl = document.createElement("div");
    textEl.className = "text";
    textEl.textContent = msg.content;

    wrapper.appendChild(meta);
    wrapper.appendChild(textEl);
    messagesEl.appendChild(wrapper);
  }

  function loadHistory() {
    fetch(SERVER_URL + "/history")
      .then((res) => res.json())
      .then((data) => {
        data.forEach(renderMessage);
        scrollToBottom();
      })
      .catch((err) => {
        console.error("Failed to load message history:", err);
      });
  }

  function connect() {
    const socket = new SockJS(SERVER_URL + "/chat");
    stompClient = Stomp.over(socket);

    // Quiet down the default STOMP console logging
    stompClient.debug = null;

    stompClient.connect(
      {},
      function onConnect() {
        setConnected(true);
        loadHistory();

        stompClient.subscribe("/topic/messages", function (message) {
          const body = JSON.parse(message.body);
          renderMessage(body);
          scrollToBottom();
        });
      },
      function onError() {
        setConnected(false);
        // Retry connection after a short delay
        setTimeout(connect, 3000);
      }
    );

    socket.onclose = function () {
      setConnected(false);
      setTimeout(connect, 3000);
    };
  }

  function sendMessage(text) {
    if (!text.trim() || !stompClient || !stompClient.connected) return;

    stompClient.send(
      "/app/send",
      {},
      JSON.stringify({
        sender: username,
        content: text.trim()
      })
    );
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    sendMessage(input.value);
    input.value = "";
    input.focus();
  });

  // Enter key sends the message (form submit already handles this,
  // but keep an explicit listener in case of any edge cases)
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  // ---- Init ----
  // Auth must resolve before we open the chat socket, since sendMessage
  // and renderMessage both depend on `username` being set.
  (async function start() {
    setConnected(false);
    const ok = await initAuth();
    if (ok) {
      connect();
    }
  })();
</script>

</body>
</html>
